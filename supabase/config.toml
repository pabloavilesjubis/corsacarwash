[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false  # Only admin invites; no self-signup
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = true
secure_password_change = true
min_password_length = 8

[realtime]
enabled = true
# Only enable realtime on operational tables — not all
# Tables: work_orders, equipment, workstations, notifications

# ─────────────────────────────────────────────
# Edge Functions
#
# `verify_jwt` decide si la plataforma exige un JWT de Supabase ANTES de que
# el pedido llegue al código de la función. Es una compuerta de Supabase, no
# nuestra, y por eso hay que declararla acá y no dentro del index.ts.
# ─────────────────────────────────────────────

[functions.admin-create-user]
# Sí: la función lee el JWT del llamante para saber quién crea al usuario y
# verificar su permiso users.manage. Sin JWT no tiene nada que verificar.
verify_jwt = true

[functions.gateway-ingest]
# No: el gateway no es un usuario de Supabase y no tiene sesión. Se autentica
# con su propia clave (X-Gateway-Key), que la función valida contra el hash
# guardado en plc_gateways.
#
# Sin esta línea la plataforma responde 401 antes de ejecutar una sola línea
# de nuestro código, y como el gateway no reintenta los 4xx, se rinde y
# registra un error que parece «clave equivocada» cuando en realidad la clave
# nunca llegó a compararse.
verify_jwt = false

[functions.push-dispatch]
# No: a esta función la llaman tres clientes distintos y sólo uno de ellos es
# un usuario de Supabase.
#
#   · el cron y el trigger de la base, que no tienen sesión y se identifican
#     con X-Dispatch-Key;
#   · el navegador pidiendo la clave pública VAPID, sin autenticar;
#   · el usuario, para el push de prueba, con su JWT.
#
# Con verify_jwt = true, la plataforma rechazaría los dos primeros antes de
# ejecutar una línea de nuestro código. La verificación de los tres casos está
# dentro del index.ts, donde se puede distinguir cuál es cuál.
verify_jwt = false
