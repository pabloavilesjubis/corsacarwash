[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false  # Only admin invites; no self-signup
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = true
secure_password_change = true
min_password_length = 8

[realtime]
enabled = true
# Only enable realtime on operational tables — not all
# Tables: work_orders, equipment, workstations, notifications
