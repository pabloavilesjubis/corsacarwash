<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: el modelo móvil usa env(safe-area-inset-*) para no
         quedar debajo del notch ni de la barra de gestos del teléfono. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CORSA Carwash — Sistema Operativo Digital</title>
    <meta name="description" content="Sistema operativo digital para CORSA Carwash. Gestión de lavado, detallado y servicios automotrices." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Security headers via meta (primary enforcement via Vercel headers) -->
    <!-- TODO(security): Move CSP to Vercel headers for proper nonce support -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />

    <!-- Favicon — el brandmark de CORSA. SVG y no PNG: una sola pieza que se
         ve nítida en cualquier densidad de pantalla, sin generar cuatro
         tamaños. El color de tema tiñe la barra del navegador en móvil, que
         sin él queda blanca y corta la cabecera de la app por la mitad. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#06322A" />

    <!-- PWA — instalable en teléfono y computadora.
         El manifiesto es lo que hace que Chrome ofrezca instalarla y lo que
         le da a Android el icono y el color de la app.

         En iPhone el icono NO sale del manifiesto: Safari usa apple-touch-icon
         y sólo entiende PNG, así que el SVG de la pestaña no sirve acá. Ese
         mismo PNG es el que después aparece en cada notificación del iPhone.

         apple-mobile-web-app-capable sigue haciendo falta: sin él, iOS abre la
         app en Safari con la barra de direcciones, y en ese modo el Web Push
         de iOS no funciona — sólo funciona instalada. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CORSA" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Google Fonts — Inter (preconnect for performance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
